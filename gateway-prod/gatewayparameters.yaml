# GatewayParameters — kgateway 2.0 mechanism for customizing the Envoy proxy
# Service that the Gateway deployer provisions. These annotations land on THAT
# Service (not on the Gateway object), which is what the AWS Load Balancer
# Controller and external-dns actually watch.
#
# Must live in the SAME namespace as the Gateway: parametersRef has no namespace
# field and resolves within the Gateway's namespace.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: rentlora-nlb-params
  namespace: production
spec:
  kube:
    service:
      type: LoadBalancer
      extraAnnotations:
        # AWS Load Balancer Controller -> provision an internet-facing NLB,
        # targeting the Envoy pods directly (ip mode, VPC CNI).
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # TLS terminates at the NLB using the ACM cert; Envoy receives plain HTTP.
        # Replace arn:aws:acm:us-east-1:611467706284:certificate/1db8c28a-68f5-42d0-a7b0-c042b1657ec9 with: terraform output acm_cert_arn (stacks/cluster).
        service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:611467706284:certificate/1db8c28a-68f5-42d0-a7b0-c042b1657ec9"
        service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
        # Origin lockdown: attach our own frontend SG (rentlora-infra
        # stacks/cluster/origin-lockdown.tf) that only admits CloudFront's
        # origin-facing IP ranges, so origin.rentlora.in can't be reached directly
        # (no WAF bypass). manage-backend-...=true keeps the controller wiring the
        # NLB->node rules. SG id = `terraform output prod_cf_origin_sg_id`.
        service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-02993939e60a6a60a"
        service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
        # external-dns creates origin.rentlora.in -> this NLB. CloudFront fronts the
        # public apex (rentlora.in) and uses origin.rentlora.in as its origin; WAF +
        # edge caching live on the CloudFront distribution (see rentlora-infra
        # modules/waf-cloudfront). The Gateway routes purely by path, so any Host works.
        external-dns.alpha.kubernetes.io/hostname: "origin.rentlora.in"
