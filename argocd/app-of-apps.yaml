# One ApplicationSet per environment, each generating an ArgoCD Application for
# every chart. Uses the multi-source `$values` pattern: the env values file lives
# outside the chart path (environments/<env>/values.yaml), which ArgoCD only
# allows to be referenced via a `ref` source — a plain `../../` valueFiles path
# is rejected as "outside the application path".
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rentlora-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: frontend
          - chart: property-service
          - chart: booking-service
          - chart: ai-service
          - chart: admin-service
          - chart: ai-search-service
  template:
    metadata:
      name: "rentlora-dev-{{chart}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/rentlora/rentlora-helm
          targetRevision: main
          ref: values
        - repoURL: https://github.com/rentlora/rentlora-helm
          targetRevision: main
          path: "charts/{{chart}}"
          helm:
            valueFiles:
              - $values/environments/dev/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: rentlora-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rentlora-prod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: frontend
          - chart: property-service
          - chart: booking-service
          - chart: ai-service
          - chart: admin-service
          - chart: ai-search-service
  template:
    metadata:
      name: "rentlora-prod-{{chart}}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/rentlora/rentlora-helm
          targetRevision: main
          ref: values
        - repoURL: https://github.com/rentlora/rentlora-helm
          targetRevision: main
          path: "charts/{{chart}}"
          helm:
            valueFiles:
              - $values/environments/prod/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
