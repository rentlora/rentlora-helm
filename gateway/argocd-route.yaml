# Exposes the ArgoCD UI at https://argocd.rentlora.in through the shared gateway.
# ArgoCD runs with --insecure (plain HTTP on argocd-server:80); the NLB terminates
# TLS, so this route forwards decrypted HTTP to argocd-server.
#
# Lives in the argocd namespace (same as argocd-server, so no ReferenceGrant needed)
# and attaches cross-namespace to the gateway in rentlora-dev via parentRefs.namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: rentlora-gateway
      namespace: rentlora-dev
  hostnames:
    - argocd.rentlora.in
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
