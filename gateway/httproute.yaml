# HTTPRoute — path routing for both listeners on the gateway.
# Gateway API uses longest-prefix precedence, so /api/search/ai (ai-search-service)
# correctly wins over /api/search (property-service) even though they overlap.
# The catch-all "/" sends everything else to the frontend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rentlora-routes
  namespace: rentlora-dev
spec:
  parentRefs:
    - name: rentlora-gateway
  rules:
    # ── ai-search-service (most specific first) ──
    - matches:
        - path: { type: PathPrefix, value: /api/search/ai }
      backendRefs:
        - name: ai-search-service
          port: 8005

    # ── property-service ──
    - matches:
        - path: { type: PathPrefix, value: /api/properties }
        - path: { type: PathPrefix, value: /api/reviews }
        - path: { type: PathPrefix, value: /api/search }
      backendRefs:
        - name: property-service
          port: 8001

    # ── booking-service ──
    - matches:
        - path: { type: PathPrefix, value: /api/bookings }
        - path: { type: PathPrefix, value: /api/auth }
        - path: { type: PathPrefix, value: /api/users }
      backendRefs:
        - name: booking-service
          port: 8002

    # ── ai-service ──
    - matches:
        - path: { type: PathPrefix, value: /api/ai }
      backendRefs:
        - name: ai-service
          port: 8003

    # ── admin-service ──
    - matches:
        - path: { type: PathPrefix, value: /api/admin }
      backendRefs:
        - name: admin-service
          port: 8004

    # ── frontend (catch-all) ──
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: 8080
