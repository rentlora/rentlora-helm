# NodePool — provisioning rules for application workloads.
# The bootstrap managed node group (rentlora-infra eks module, 2x t3.medium)
# carries system pods; Karpenter scales app nodes on top of it.
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      requirements:
        # The AWS Organization's SCP (p-rn6vr8ok) denies ec2:RunInstances for all
        # but on-demand t3.medium — the type the managed node group is allowed to
        # launch. Spot and other instance types get an "explicit deny in a service
        # control policy". Keep this NodePool to that single allowed shape; widen it
        # only if the org SCP is relaxed. (See NEW-ACCOUNT-SETUP.md / SCP note.)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium"]
  limits:
    cpu: 16
    memory: 64Gi
  disruption:
    # WhenUnderutilized consolidates by bin-packing pods onto fewer nodes.
    # NOTE: consolidateAfter is only valid with WhenEmpty in Karpenter 0.37 (v1beta1);
    # it must be omitted here or the NodePool fails validation.
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
