# EC2NodeClass — defines the AWS-level shape of nodes Karpenter provisions.
# Subnets and security groups are discovered by the karpenter.sh/discovery tag,
# which rentlora-infra applies to the private subnets (vpc module) and the EKS
# node security group (eks module). Both are tagged with the cluster name.
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  # Node IAM role created by rentlora-infra (addons module). Karpenter manages
  # the matching instance profile from this role.
  role: "rentlora-eks-karpenter-node"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rentlora-eks"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rentlora-eks"
  tags:
    karpenter.sh/discovery: "rentlora-eks"
    managed-by: "karpenter"
