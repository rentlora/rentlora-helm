# Shared override applied to ALL 6 charts for the dev environment.
# Referenced by the ArgoCD ApplicationSet via the $values multi-source ref.
#
# Fill the <...> placeholders from Terraform outputs (no account IDs committed):
#   ecrRegistry  -> 280646578520.dkr.ecr.us-east-1.amazonaws.com
#   irsaRoleArns -> terraform output -json irsa_role_arns   (stacks/dev)
#   acmCertArn   -> terraform output acm_cert_arn           (stacks/cluster)
global:
  namespace: rentlora-dev
  env: dev
  region: us-east-1
  imageTag: 37a5bc67dd318a3003d24614cce8f50f1fcde95c                # bumped by rentlora build.yml on each release
  ecrRegistry: "280646578520.dkr.ecr.us-east-1.amazonaws.com"

# IRSA role ARNs — role name pattern: rentlora-eks-dev-<service>
irsaRoleArns:
  property-service:  "arn:aws:iam::280646578520:role/rentlora-eks-dev-property-service"
  booking-service:   "arn:aws:iam::280646578520:role/rentlora-eks-dev-booking-service"
  ai-service:        "arn:aws:iam::280646578520:role/rentlora-eks-dev-ai-service"
  admin-service:     "arn:aws:iam::280646578520:role/rentlora-eks-dev-admin-service"
  ai-search-service: "arn:aws:iam::280646578520:role/rentlora-eks-dev-ai-search-service"

# Consumed by gateway/gatewayparameters.yaml (applied separately from the charts).
acmCertArn: "arn:aws:acm:us-east-1:280646578520:certificate/7e4ff623-c276-4546-a806-c2dbe5574143"
