# Shared override applied to ALL charts for the dev environment.
# Referenced by the ArgoCD ApplicationSet via the $values multi-source ref.
#
# Account-specific config is a SINGLE value (global.accountId). The charts DERIVE the
# ECR registry and each service's IRSA role ARN from it — nothing else hardcodes the
# account. On a new account, change accountId (+ acmCertArn) and that's it.
global:
  namespace: rentlora-dev
  env: dev
  region: us-east-1
  accountId: "611467706284"          # the ONE account-specific value
  cluster: rentlora-eks              # role names: <cluster>-<env>-<service>
  imageTag: 807bca41196566349caa40f046cec260c7c8b566 # fallback tag (per-service overrides below)

# Cost: dev runs on Karpenter SPOT nodes (cheap, can be reclaimed on 2-min notice),
# single replica, HPA floor of 1. These root-level keys override every chart's
# defaults (Helm merges this values file over each chart's values.yaml).
nodeSelector:
  karpenter.sh/capacity-type: spot
replicaCount: 1
hpa:
  minReplicas: 1

# Per-service image tags — bumped INDIVIDUALLY by rentlora build.yml so a one-service
# change only rebuilds + redeploys that service. Charts fall back to global.imageTag.
imageTags:
  frontend: 3c3ae9cb07943f9e716f8343a3efd00c218eaf6a
  property-service: 3c3ae9cb07943f9e716f8343a3efd00c218eaf6a
  booking-service: 3c3ae9cb07943f9e716f8343a3efd00c218eaf6a
  ai-service: 3c3ae9cb07943f9e716f8343a3efd00c218eaf6a
  admin-service: 3c3ae9cb07943f9e716f8343a3efd00c218eaf6a
  ai-search-service: 3c3ae9cb07943f9e716f8343a3efd00c218eaf6a
  user-service: 3c3ae9cb07943f9e716f8343a3efd00c218eaf6a

# Consumed by gateway/gatewayparameters.yaml (applied separately). The cert UUID is
# unique per environment, so this can't be derived — set it once at bootstrap.
acmCertArn: "arn:aws:acm:us-east-1:611467706284:certificate/1db8c28a-68f5-42d0-a7b0-c042b1657ec9"
