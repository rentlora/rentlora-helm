# Shared override applied to ALL 6 charts for the prod environment.
# Referenced by the prod ArgoCD ApplicationSet via the $values multi-source ref.
#
# Fill the <...> placeholders from Terraform outputs (no account IDs committed):
#   ecrRegistry  -> <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com
#   irsaRoleArns -> terraform output -json irsa_role_arns   (stacks/prod)
#   acmCertArn   -> terraform output acm_cert_arn           (stacks/cluster)
global:
  namespace: production
  env: prod
  region: us-east-1
  imageTag: latest                # pin to a released tag in prod; bumped by build.yml
  ecrRegistry: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com"

# IRSA role ARNs — role name pattern: rentlora-eks-prod-<service>
irsaRoleArns:
  property-service:  "arn:aws:iam::<ACCOUNT_ID>:role/rentlora-eks-prod-property-service"
  booking-service:   "arn:aws:iam::<ACCOUNT_ID>:role/rentlora-eks-prod-booking-service"
  ai-service:        "arn:aws:iam::<ACCOUNT_ID>:role/rentlora-eks-prod-ai-service"
  admin-service:     "arn:aws:iam::<ACCOUNT_ID>:role/rentlora-eks-prod-admin-service"
  ai-search-service: "arn:aws:iam::<ACCOUNT_ID>:role/rentlora-eks-prod-ai-search-service"

# Consumed by a prod copy of gateway/gatewayparameters.yaml (namespace: production).
acmCertArn: "<ACM_CERT_ARN>"
