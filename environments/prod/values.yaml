# Shared override applied to ALL 6 charts for the prod environment.
# Referenced by the prod ArgoCD ApplicationSet via the $values multi-source ref.
#
# Fill the <...> placeholders from Terraform outputs (no account IDs committed):
#   ecrRegistry  -> 280646578520.dkr.ecr.us-east-1.amazonaws.com
#   irsaRoleArns -> terraform output -json irsa_role_arns   (stacks/prod)
#   acmCertArn   -> terraform output acm_cert_arn           (stacks/cluster)
global:
  namespace: production
  env: prod
  region: us-east-1
  imageTag: latest                # pin to a released tag in prod; bumped by build.yml
  ecrRegistry: "280646578520.dkr.ecr.us-east-1.amazonaws.com"

# IRSA role ARNs — role name pattern: rentlora-eks-prod-<service>
irsaRoleArns:
  property-service:  "arn:aws:iam::280646578520:role/rentlora-eks-prod-property-service"
  booking-service:   "arn:aws:iam::280646578520:role/rentlora-eks-prod-booking-service"
  ai-service:        "arn:aws:iam::280646578520:role/rentlora-eks-prod-ai-service"
  admin-service:     "arn:aws:iam::280646578520:role/rentlora-eks-prod-admin-service"
  ai-search-service: "arn:aws:iam::280646578520:role/rentlora-eks-prod-ai-search-service"

# Consumed by a prod copy of gateway/gatewayparameters.yaml (namespace: production).
acmCertArn: "arn:aws:acm:us-east-1:280646578520:certificate/7e4ff623-c276-4546-a806-c2dbe5574143"
