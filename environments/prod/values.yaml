# Shared override applied to ALL charts for the prod environment.
# Referenced by the prod ArgoCD ApplicationSet via the $values multi-source ref.
#
# Account-specific config is a SINGLE value (global.accountId). Charts DERIVE the ECR
# registry and each IRSA role ARN from it. Per-service imageTags are promoted from dev
# by release.yml when a GitHub Release is published.
global:
  namespace: production
  env: prod
  region: us-east-1
  accountId: "611467706284" # the ONE account-specific value
  cluster: rentlora-eks # role names: <cluster>-<env>-<service>
  imageTag: a82605c07b5d4a5d1854dc2255ccb4d44d626ae8 # fallback only
# Per-service image tags — promoted from dev by release.yml.
# releaseVersion is written by the pipeline for auditability.
releaseVersion: "v1.2.0"
imageTags:
  frontend: c31878100a5a5b2ac84f54948e1bb5bc7e5ab013
  property-service: f1b74c57b968c3e35059f2825c1fe0e8ecc8b63d
  booking-service: af91cc60b5b3876a5d1c8d75e74874ca90956f89
  ai-service: ae86e4ad1f10d25f7068028d3f26d275f6a5f477
  admin-service: af91cc60b5b3876a5d1c8d75e74874ca90956f89
  ai-search-service: 0068c7b4f73152168baeb5bba345a234e80f6c58
  user-service: af91cc60b5b3876a5d1c8d75e74874ca90956f89
# Single replica per service (cost). On a paid plan, bump to 2 for HA anytime.
replicaCount: 1
hpa:
  minReplicas: 1
# Consumed by a prod copy of gateway/gatewayparameters.yaml (namespace: production).
# Cert UUID is unique per env, so set once at bootstrap (not derivable).
acmCertArn: "arn:aws:acm:us-east-1:611467706284:certificate/1db8c28a-68f5-42d0-a7b0-c042b1657ec9"
