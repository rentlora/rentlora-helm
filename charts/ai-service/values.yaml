serviceName: ai-service

image:
  name: rentlora-ai-service
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8003

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Defaults so `helm template` renders standalone; overridden per environment.
global:
  accountId: ""
  cluster: "rentlora-eks"
  imageTag: "latest"
  env: "dev"
  region: "us-east-1"

