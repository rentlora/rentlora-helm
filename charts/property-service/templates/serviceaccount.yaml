apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceName }}
  annotations:
    # IRSA role ARN, derived as <cluster>-<env>-<service>. No per-service account id;
    # set global.accountId once per environment.
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ .Values.global.accountId }}:role/{{ .Values.global.cluster }}-{{ .Values.global.env }}-{{ .Values.serviceName }}"
